name: Export translation script

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/extract_translation_script.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - name: Verify script
        run: |
          python -m py_compile scripts/translate_pdf_edge.py
          sha256sum scripts/translate_pdf_edge.py
      - name: Upload script
        uses: actions/upload-artifact@v4
        with:
          name: SSCP-Translation-Script
          path: scripts/translate_pdf_edge.py
          retention-days: 7
          compression-level: 0
