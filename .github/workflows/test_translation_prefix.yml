name: Test English Chinese translation prefix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test_translation_prefix.yml'

permissions:
  contents: write

jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.1' sentencepiece sacremoses
      - name: Translate samples
        run: |
          python - <<'PY'
          import json, unicodedata, torch
          from transformers import MarianMTModel, MarianTokenizer
          name='Helsinki-NLP/opus-mt-en-zh'
          tok=MarianTokenizer.from_pretrained(name)
          model=MarianMTModel.from_pretrained(name).eval()
          samples=[
          'AFTER ACTION REVIEW OF THE COVID-19 PANDEMIC: The Lessons Learned and a Path Forward Final Report of the Select Subcommittee on the Coronavirus Pandemic Committee on Oversight and Accountability U.S. House of Representatives December 4, 2024',
          'Wuhan Institute of Virology [hereinafter “WIV”] Office of Director of National Intelligence [hereinafter “ODNI”] U.S. Department of Energy [hereinafter “DOE”] Federal Bureau of Investigation [hereinafter “FBI”]',
          'Four years after the onset of the worst pandemic in 100 years, the weight of the evidence increasingly supports the lab leak hypothesis. Since the Select Subcommittee commenced its work in February 2023, more and more senior intelligence officials, politicians, science editors, and scientists increasingly have endorsed the hypothesis that COVID-19 emerged as the result of a laboratory or research related accident.',
          'EcoHealth Alliance, Inc. Facilitated Gain-of-Function Research at the Wuhan Institute of Virology.',
          'The Executive Chamber withheld documents and communications involving nursing home data.'
          ]
          out=[]
          for src in samples:
            variants={}
            for key,prefix in [('none',''),('cmn_Hans','>>cmn_Hans<< '),('cmn','>>cmn<< ')]:
              enc=tok([prefix+src],return_tensors='pt',padding=True,truncation=True,max_length=512)
              with torch.inference_mode():
                gen=model.generate(**enc,num_beams=4,do_sample=False,max_new_tokens=512,renormalize_logits=True,early_stopping=True)
              text=tok.batch_decode(gen,skip_special_tokens=True)[0]
              variants[key]=unicodedata.normalize('NFKC',text)
            out.append({'source':src,'translations':variants})
          open('translation_prefix_test.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation_prefix_test.json
          git commit -m 'Add translation prefix comparison' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
