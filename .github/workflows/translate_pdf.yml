name: Translate SSCP report to Chinese

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/translate_pdf.py.gz.b64'
      - '.github/workflows/translate_pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
      REPORT_URL: 'https://oversight.house.gov/wp-content/uploads/2024/12/2024.12.04-SSCP-FINAL-REPORT-ANS.pdf'
      OUTPUT_PDF: '2024.12.04-SSCP-FINAL-REPORT-ANS-中文翻译版.pdf'
    steps:
      - name: Check out translation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils qpdf
          fc-cache -f

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir pymupdf==1.26.7 transformers==4.57.1 sentencepiece sacremoses

      - name: Download source report
        run: |
          curl -L --fail --retry 5 --retry-delay 5 "$REPORT_URL" -o source.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('source.pdf')
          assert len(d)==557, len(d)
          print('source pages:', len(d))
          PY

      - name: Translate and rebuild PDF
        run: |
          base64 -d scripts/translate_pdf.py.gz.b64 | gzip -d > /tmp/translate_pdf.py
          python /tmp/translate_pdf.py \
            --input source.pdf \
            --output "$OUTPUT_PDF" \
            --font /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
            --batch-size 12 \
            --beams 2 \
            --work-dir translation_work

      - name: Verify PDF structure and render samples
        run: |
          python - <<'PY'
          import fitz, json, os
          from pathlib import Path
          p=Path(os.environ['OUTPUT_PDF'])
          d=fitz.open(p)
          assert len(d)==557, len(d)
          assert p.stat().st_size < 100_000_000, p.stat().st_size
          report=json.loads(Path('translation_work/verification.json').read_text('utf-8'))
          assert report['page_count_match']
          assert report['pages_with_chinese_text_after'] >= 500, report
          print(json.dumps(report, ensure_ascii=False, indent=2))
          for pn in [0, 14, 37, 94, 199, 399, 556]:
              pix=d[pn].get_pixmap(matrix=fitz.Matrix(1.5,1.5), alpha=False)
              pix.save(f'translation_work/check-page-{pn+1}.png')
          PY
          pdfinfo "$OUTPUT_PDF" | head -30

      - name: Optimize if needed
        run: |
          size=$(stat -c%s "$OUTPUT_PDF")
          if [ "$size" -gt 90000000 ]; then
            qpdf --object-streams=generate --stream-data=compress "$OUTPUT_PDF" optimized.pdf
            mv optimized.pdf "$OUTPUT_PDF"
          fi
          test $(stat -c%s "$OUTPUT_PDF") -lt 100000000

      - name: Upload final PDF and verification package
        uses: actions/upload-artifact@v4
        with:
          name: SSCP-Chinese-Translated-PDF
          path: |
            ${{ env.OUTPUT_PDF }}
            translation_work/verification.json
            translation_work/layout_issues.json
            translation_work/check-page-*.png
          retention-days: 30
          compression-level: 0

      - name: Commit final PDF to translation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PDF" translation_work/verification.json translation_work/layout_issues.json
          git commit -m 'Add completed Chinese translation of SSCP report' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
