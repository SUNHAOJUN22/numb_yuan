name: Build SSCP Chinese translated PDF

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/edge_parts/**'
      - '.github/workflows/build_sscp_chinese_pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REPORT_URL: 'https://oversight.house.gov/wp-content/uploads/2024/12/2024.12.04-SSCP-FINAL-REPORT-ANS.pdf'
      OUTPUT_PDF: '2024.12.04-SSCP-FINAL-REPORT-ANS-中文翻译版-精校排版.pdf'
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils qpdf
          fc-cache -f

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir pymupdf==1.26.7 requests

      - name: Download and validate source report
        run: |
          curl -L --fail --retry 6 --retry-delay 5 "$REPORT_URL" -o source.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('source.pdf')
          assert len(d)==557, len(d)
          print('source pages:', len(d))
          print('source bytes:', __import__('os').path.getsize('source.pdf'))
          PY

      - name: Reassemble and decode translation script
        run: |
          cat scripts/edge_parts/part* > /tmp/translate_pdf_edge.py.gz.b64
          echo 'a7777301952431ab0a8d796ed8b9eb8a38f2833231e8ecb8a5c3ad3d21b6577a  /tmp/translate_pdf_edge.py.gz.b64' | sha256sum -c -
          base64 -d /tmp/translate_pdf_edge.py.gz.b64 | gzip -d > /tmp/translate_pdf_edge.py
          echo '5b73f33bd0bbf815598ca3e38a0cb7b27e0d0922c67b1ca648f67d2711ac8be9  /tmp/translate_pdf_edge.py' | sha256sum -c -
          python -m py_compile /tmp/translate_pdf_edge.py

      - name: Translate selectable text and rebuild PDF
        run: |
          REGULAR_FONT=$(fc-match -f '%{file}\n' 'Noto Sans CJK SC:style=Regular' | head -1)
          BOLD_FONT=$(fc-match -f '%{file}\n' 'Noto Sans CJK SC:style=Bold' | head -1)
          echo "regular font: $REGULAR_FONT"
          echo "bold font: $BOLD_FONT"
          test -f "$REGULAR_FONT"
          test -f "$BOLD_FONT"
          python /tmp/translate_pdf_edge.py \
            --input source.pdf \
            --output "$OUTPUT_PDF" \
            --font "$REGULAR_FONT" \
            --bold-font "$BOLD_FONT" \
            --work-dir translation_work

      - name: Structural verification and sample rendering
        run: |
          python - <<'PY'
          import fitz, json, os
          from pathlib import Path
          out=Path(os.environ['OUTPUT_PDF'])
          d=fitz.open(out)
          assert len(d)==557, len(d)
          report=json.loads(Path('translation_work/verification.json').read_text('utf-8'))
          assert report['page_count_match'], report
          assert report['image_object_counts_match'], report
          assert report['pages_with_chinese_text_after'] >= 525, report
          assert report['translation_unit_issue_count'] == 0, report
          print(json.dumps(report, ensure_ascii=False, indent=2))
          for page in d:
              _=page.get_pixmap(matrix=fitz.Matrix(0.20,0.20), alpha=False)
          for pn in [0,2,3,14,24,37,94,199,399,556]:
              pix=d[pn].get_pixmap(matrix=fitz.Matrix(1.6,1.6), alpha=False)
              pix.save(f'translation_work/check-page-{pn+1}.png')
          PY
          pdfinfo "$OUTPUT_PDF" | head -40

      - name: Optimize if required
        run: |
          size=$(stat -c%s "$OUTPUT_PDF")
          if [ "$size" -gt 92000000 ]; then
            qpdf --object-streams=generate --stream-data=compress "$OUTPUT_PDF" optimized.pdf
            mv optimized.pdf "$OUTPUT_PDF"
          fi
          test $(stat -c%s "$OUTPUT_PDF") -lt 100000000

      - name: Upload final PDF and verification package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SSCP-Chinese-Translated-PDF-Final
          path: |
            ${{ env.OUTPUT_PDF }}
            translation_work/verification.json
            translation_work/layout_issues.json
            translation_work/translation_quality.json
            translation_work/check-page-*.png
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: Commit completed output to build branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PDF" translation_work/verification.json translation_work/layout_issues.json translation_work/translation_quality.json
          git commit -m 'Add completed Chinese translation of SSCP report' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
